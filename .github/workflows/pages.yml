name: Black Friday 2026 preview

on:
  # Secours : le planificateur GitHub retarde souvent ce cron (observé : ~1 exécution/heure).
  # La fraîcheur est garantie par l'auto-relance du job « rearm » ci-dessous.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: vars.BF_PAGES_LIVE == 'true'
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch current public catalog (read-only)
        run: python collect_catalogue.py
      - name: Build preview and validate source data
        run: |
          python build_site.py
          python - <<'PY'
          import json
          from pathlib import Path
          snap = json.loads(Path('catalogue.json').read_text())
          page = Path('site/index.html').read_text()
          assert snap['availableCount'] == len(snap['products']) > 0
          assert page.rstrip().endswith('</html>')
          assert 'Préproduction · remises simulées' in page
          assert 'sync-error' in page
          assert 'createOrder' not in page
          assert 'fetch(' not in page
          assert '__DATA__' not in page
          import build_site
          data, by_id, excluded = build_site.build_data(snap)
          stock = {p['id'] for p in snap['products'] if int(p['availableQuantity']) > 0}
          assert len(set(build_site.SPECIAL_30_IDS)) == len(build_site.SPECIAL_30_IDS) == 55
          assert set(data['special']) == set(build_site.SPECIAL_30_IDS) & stock
          assert all(0 < by_id[i]['sp'] < by_id[i]['price'] for i in data['special'])
          assert all(by_id[i]['sp'] == build_site.special_price(by_id[i]['price']) for i in data['special'] if by_id[i]['spSource'] == 'simulation')
          assert all(all(i in by_id for i in r['ids']) for r in data['routines'])
          print(f"special={len(data['special'])}/55 packs={len(data['routines'])} excluded={sorted(excluded)}")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy preview only
        id: deployment
        uses: actions/deploy-pages@v4

  # Auto-relance : 10 min après chaque exécution (réussie ou non), relance ce même workflow sur main.
  # Une seule chaîne survit (cancel-in-progress) ; BF_PAGES_LIVE != 'true' arrête tout.
  rearm:
    needs: build-and-deploy
    if: ${{ always() && vars.BF_PAGES_LIVE == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-rearm
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Wait before next refresh
        run: sleep 600
      - name: Trigger next refresh on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
